name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc가 @prisma/client 타입을 요구한다. 생성이 install postinstall에만 의존하면
      # pnpm store 캐시가 복원될 때 그 단계가 건너뛰어져 Lint가 TS2305로 깨진다.
      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: MCP smoke
        run: pnpm run smoke:mcp

      - name: MCP scorecard
        run: pnpm run check:mcp-scorecard

      # 도구 개수는 문서가 아니라 살아있는 서버가 정한다. 이 단계는 tools/list를
      # 읽어 주석/쓰기 집합 불변식을 검사하며, 어떤 개수도 하드코딩하지 않는다.
      - name: MCP inventory truth
        run: pnpm run check:mcp-inventory-truth

      # 오프라인 픽스처는 토큰 없이도 규칙 자체가 살아있음을 증명한다.
      - name: Tracker truth (offline fixture)
        run: pnpm run check:tracker-truth:offline

      # 실제 GitHub 그래프 검증은 읽기 전용이며, 토큰이 있는 원본 저장소에서만 돈다.
      - name: Tracker truth (live graph)
        if: github.event_name == 'push' && github.repository == 'whelp99-code/whelp99-code-sangfor-engineer-mcp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run check:tracker-truth
