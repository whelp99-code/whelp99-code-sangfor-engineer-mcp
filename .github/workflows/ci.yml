name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc가 @prisma/client 타입을 요구한다. 생성이 install postinstall에만 의존하면
      # pnpm store 캐시가 복원될 때 그 단계가 건너뛰어져 Lint가 TS2305로 깨진다.
      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: MCP smoke
        run: pnpm run smoke:mcp

      - name: MCP scorecard
        run: pnpm run check:mcp-scorecard
