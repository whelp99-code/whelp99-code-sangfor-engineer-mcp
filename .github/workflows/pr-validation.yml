name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ci.yml과 같은 이유: tsc가 요구하는 @prisma/client 생성을 postinstall 부수효과에
      # 맡기면 캐시 복원 시 건너뛰어진다.
      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # 이전의 두 inline grep 게이트를 대체한다. 그 게이트들은 존재하지 않는 `src/`를
      # 인자로 받아 grep이 exit 2를 반환했고, `if grep ...; then`이 2를 거짓으로 처리해
      # 위반이 있어도 항상 통과했다. 규칙과 종료코드는 tests/check-source-hygiene이 고정한다.
      - name: Source hygiene (stdout purity, TODO/FIXME)
        run: pnpm run check:hygiene